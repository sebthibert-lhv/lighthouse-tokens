name: Sync colours

# Regenerates the Lighthouse colours from the tokens and opens (or updates)
# a pull request in each platform's components repo with the result.

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "config.mjs"
      - "style-dictionary/**"
      - ".github/workflows/sync-colours.yml"
  workflow_dispatch:

concurrency:
  group: sync-colours
  cancel-in-progress: true

jobs:
  sync:
    name: Sync ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # repo is the repository name under this repo's owner, which is
          # also where the GitHub App must be installed.
          - platform: iOS
            repo: lighthouse-ios
            source: build/ios-swift/LighthouseColor.swift
            dest: Sources/Lighthouse/Tokens/LighthouseColor.swift
    steps:
      - name: Check out tokens
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate colours
        run: npx --yes style-dictionary@4.4.0 build --config config.mjs

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LIGHTHOUSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIGHTHOUSE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out ${{ matrix.platform }} components repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: components

      - name: Copy generated file
        env:
          SOURCE: ${{ matrix.source }}
          DEST: ${{ matrix.dest }}
        run: |
          mkdir -p "components/$(dirname "$DEST")"
          cp "$SOURCE" "components/$DEST"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: components
          token: ${{ steps.app-token.outputs.token }}
          branch: lighthouse/update-colours
          delete-branch: true
          commit-message: Update Lighthouse colours
          title: Update Lighthouse colours
          body: |
            Regenerated `${{ matrix.dest }}` from the Lighthouse design tokens.

            Source commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
